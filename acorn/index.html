<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Vinit Rao - Acornz</title>
    
    <link rel="stylesheet" href="../css/minimal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      body { 
        background-color: #191919 !important; 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden;
      }
      
      .game-page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 40px;
      }

      /* Centering the Unity container and removing absolute positioning */
      #unity-container { 
        position: relative !important; 
        margin: 20px auto !important;
        border: 2px solid #545454;
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        left: auto !important;
        top: auto !important;
        transform: none !important;
      }

      /* Removes the Unity logo, WebGL logo, and Fullscreen button */
      #unity-footer {
        display: none !important;
      }
    </style>
  </head>
  <body>

    <nav class="hero-nav">
      <div class="logo">
        <a href="../index.html" class="navbtn">Vinit Rao</a>
      </div>
      <div class="hero-buttons">
        <a href="../about.html" class="navbtn">About</a>
        <a href="../resume.html" class="navbtn">Resume</a>
      </div>
    </nav>

    <div class="game-page-container">
      <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=600 height=800 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
          <div id="unity-webgl-logo"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">Acornz</div>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/acorn.loader.js";
      var config = {
        dataUrl: buildUrl + "/acorn.data.unityweb",
        frameworkUrl: buildUrl + "/acorn.framework.js.unityweb",
        codeUrl: buildUrl + "/acorn.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TinyGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Reduced size for better laptop visibility
        canvas.style.width = "600px";
        canvas.style.height = "800px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>
  </body>
</html>

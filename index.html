<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinit Rao - Portfolio</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/minimal.css" />
  <style>
    /* Compact Hero */
    .hero-section {
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px 40px;
    }

    .hero-name {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .hero-tagline {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .hero-links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .hero-link {
      color: var(--text-primary);
      font-size: 2rem;
      transition: all 0.3s ease;
    }

    .hero-link:hover {
      color: var(--primary);
      transform: translateY(-3px);
    }

    /* Filter Section */
    .work-section {
      padding: 40px 0;
    }

    .section-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 3rem;
    }

    .filter-pills {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 4rem;
    }

    .filter-pill {
      padding: 12px 28px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 50px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .filter-pill:hover {
      border-color: var(--primary);
      background: rgba(179, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .filter-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .filter-pill .count {
      opacity: 0.7;
      margin-left: 8px;
    }

    /* Search */
    .search-container {
      max-width: 600px;
      margin: 0 auto 3rem;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      width: 100%;
      padding: 16px 24px 16px 60px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 50px;
      color: var(--text-primary);
      font-size: 1.05rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(179, 0, 0, 0.2);
    }

    .search-wrapper i {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 1.2rem;
    }

    /* Clean grid */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .work-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
      }
    }

    @media (min-width: 1200px) {
      .work-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .project-card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      aspect-ratio: 4/3;
      background: var(--bg-card);
    }

    .project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .project-card:hover img {
      transform: scale(1.05);
    }

    .project-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      z-index: 2;
    }

    .project-card:hover .project-overlay {
      opacity: 1;
    }

    .project-overlay h3 {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .project-overlay p {
      color: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .project-overlay .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(179, 0, 0, 0.8);
      border: 1px solid var(--primary);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 6rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 5rem;
      opacity: 0.3;
      margin-bottom: 2rem;
    }

    body.popup-open {
      overflow: hidden;
    }

    .popup {
      overflow-y: auto;
    }

    .popup-content {
      margin: 40px auto;
    }
  </style>
</head>

<body>

  <a href="#top" class="back-to-top" id="backToTop">↑</a>
  <div id="particles-js"></div>

  <div class="container" id="top">

    <nav class="hero-nav">
      <div class="logo">

      </div>

        <a href="about.html" class="navbtn">About</a>
        <a href="resume.html" class="navbtn">Resume</a>
      </div>
    </nav>

    <!-- Compact Hero -->
    <section class="hero-section">
      <div>
        <h1 class="hero-name">VINIT RAO</h1>
        <p class="hero-tagline">Multimedia Editor × Interactive Media Designer</p>
        
        <div class="hero-links">
          <a href="https://github.com/vinit-rao" class="hero-link" target="_blank" title="GitHub">

          </a>
          <a href="https://www.youtube.com/@OfficialVinitRao" class="hero-link" target="_blank" title="YouTube">

          </a>
        </div>
      </div>
    </section>

    <!-- Work Section -->
    <section class="work-section">
      <h2 class="section-title">Work</h2>

      <!-- Search -->
      <div class="search-container">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="search" id="projectSearch" placeholder="Search projects..." />
        </div>

      <!-- Filters -->
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">

        <button class="filter-pill" data-filter="photos">

        </button>

        <button class="filter-pill" data-filter="code">

        </button>
      </div>

      <!-- Grid -->
      <div class="work-grid" id="work-grid"></div>
      
      <div id="no-results" class="empty-state hidden">

    <!-- Footer -->
    <footer style="background-color: #0a0a0a; color: white; padding: 2.5rem 0; text-align: center; margin-top: 6rem; border-top: 1px solid #545454;">

        <p style="font-size: 1rem; margin-bottom: 1.25rem; font-weight: 500; color: #aaa;">Let's create something amazing together</p>
        <div style="margin: 1.25rem 0;">
          <a href="https://www.linkedin.com/in/vinitrao1/" style="color: white; margin: 0 15px; font-size: 1.5rem; transition: color 0.3s;" target="_blank">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://github.com/vinit-rao" style="color: white; margin: 0 15px; font-size: 1.5rem; transition: color 0.3s;" target="_blank">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.youtube.com/@OfficialVinitRao" style="color: white; margin: 0 15px; font-size: 1.5rem; transition: color 0.3s;" target="_blank">
            <i class="fab fa-youtube"></i>

  <!-- Scripts - ORDER MATTERS! -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="js/script.js"></script>
  <script src="js/projects.js"></script> <!-- Load projects FIRST -->

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded');
      console.log('Projects defined?', typeof projects);
      console.log('Projects array:', typeof projects !== 'undefined' ? projects : 'NOT DEFINED');
      
      // Check if projects is actually an array
      if (typeof projects === 'undefined') {
        console.error('CRITICAL: projects is not defined!');
        document.getElementById('work-grid').innerHTML = `
          <div style="grid-column: 1/-1; padding: 4rem; text-align: center; color: #aaa;">
            <h3>⚠️ Projects Not Loading</h3>
            <p>The projects.js file is not loading correctly.</p>
            <p>Check that js/projects.js exists and the path is correct.</p>
          </div>
        `;
        return;
      }

      if (!Array.isArray(projects)) {
        console.error('CRITICAL: projects is not an array!', projects);
        return;
      }

      console.log('✅ Projects loaded successfully:', projects.length, 'projects');
      
      const grid = document.getElementById('work-grid');
      const searchInput = document.getElementById('projectSearch');
      const filterBtns = document.querySelectorAll('.filter-pill');
      const noResults = document.getElementById('no-results');
      let activeFilter = 'all';

      function createCard(project) {
        const badges = project.badges.map(b => `<span class="badge">${b}</span>`).join('');
        return `
          <article class="project-card" 
            data-category="${project.category}"
            data-title="${project.title}"
            data-description="${project.description}"
            data-link="${project.link}"
            data-popup-image="${project.popupImage || project.image}"
            role="button" tabindex="0">
            <img src="${project.image}" alt="${project.title}">
            <div class="project-overlay">
              <h3>${project.title}</h3>
              <p>${project.description}</p>
              ${badges}
            </div>
          </article>
        `;
      }

      function loadProjects() {
        console.log('Loading', projects.length, 'projects into grid...');
        grid.innerHTML = projects.map(createCard).join('');
        console.log('✅ Grid populated');
        
        document.getElementById('count-all').textContent = ` (${projects.length})`;
        document.getElementById('count-video').textContent = ` (${projects.filter(p => p.category === 'video').length})`;
        document.getElementById('count-photos').textContent = ` (${projects.filter(p => p.category === 'photos').length})`;
        document.getElementById('count-graphics').textContent = ` (${projects.filter(p => p.category === 'graphics').length})`;
        document.getElementById('count-code').textContent = ` (${projects.filter(p => p.category === 'code').length})`;

        document.querySelectorAll('.project-card').forEach(card => {
          card.addEventListener('click', () => openPopup(card));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openPopup(card);
            }
          });
        });
        
        console.log('✅ Event listeners attached');
      }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    searchInput.addEventListener('input', applyFilters);

    function applyFilters() {
      const term = searchInput.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.project-card');
      let visibleCount = 0;

      cards.forEach(card => {
        const category = card.dataset.category;
        const title = card.dataset.title.toLowerCase();
        const desc = card.dataset.description.toLowerCase();
        
        const matchesFilter = activeFilter === 'all' || category === activeFilter;
        const matchesSearch = !term || title.includes(term) || desc.includes(term);
        const isVisible = matchesFilter && matchesSearch;
        
        card.classList.toggle('hidden', !isVisible);
        if (isVisible) visibleCount++;
      });

      noResults.classList.toggle('hidden', visibleCount > 0);
    }

    function openPopup(card) {
      const popup = document.getElementById('project-popup');
      document.getElementById('popup-title').textContent = card.dataset.title;
      document.getElementById('popup-description').textContent = card.dataset.description;
      document.getElementById('popup-link').href = card.dataset.link;
      document.getElementById('popup-image').src = card.dataset.popupImage;
      
      popup.classList.remove('hidden');
      popup.classList.add('show');
      document.body.classList.add('popup-open');
    }

    function closePopup() {
      const popup = document.getElementById('project-popup');
      popup.classList.remove('show');
      popup.classList.add('hidden');
      document.body.classList.remove('popup-open');
    }

    // Close on X button
    document.getElementById('popup-close').addEventListener('click', closePopup);

    // Close on outside click
    document.getElementById('project-popup').addEventListener('click', function(e) {
      if (e.target === this) {
        closePopup();
      }
    });

    // Close on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const popup = document.getElementById('project-popup');
        if (!popup.classList.contains('hidden')) {
          closePopup();
        }
      }
    });

    loadProjects();
    applyFilters();
    }); // End DOMContentLoaded
  </script>

  <!-- Popup -->
  <div id="project-popup" class="popup hidden">
    <div class="popup-content">
      <span class="popup-close" id="popup-close" onclick="closePopup()">×</span>
      <img id="popup-image" src="" alt="" class="popup-image">
      <h3 id="popup-title"></h3>
      <p id="popup-description"></p>
      <a id="popup-link" href="#" target="_blank" rel="noopener">
        <i class="fas fa-external-link-alt"></i> View Project
      </a>
    </div>
  </div>

</body>

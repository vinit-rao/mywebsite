<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Projects - Vinit Rao</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/minimal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="bg-glow"></div>
  <div id="night-sky"></div>

  <nav class="hero-nav">
    <div class="container nav-wrapper">
      <div class="logo"><a href="index.html">VINIT RAO</a></div>
      <div class="hamburger" id="hamburger-menu">
        <i class="fas fa-bars"></i>
      </div>
      <div class="hero-buttons" id="nav-links">
        <a href="projects.html" class="navbtn" style="color: var(--primary);">Projects</a>
        <a href="about.html" class="navbtn">About</a>
        <a href="resume.html" class="navbtn">Resume</a>
        <a href="contact.html" class="navbtn">Contact</a>
      </div>
    </div>
  </nav>

  <section id="all-projects" class="full-width-section" style="margin-top: 60px; margin-bottom: 80px; border-top: none;">
    <div class="container">
      
      <div class="bento-grid" style="margin-bottom: 40px;">
        <div class="bento-item bento-bio" style="grid-column: span 4; grid-row: span 1; justify-content: center;">
            <h2 style="margin-bottom: 5px;">ALL PROJECTS</h2>
            <p style="margin-bottom: 0;">VINIT RAO // FULL PROJECT ARCHIVE</p>
        </div>
      </div>

      <div class="bento-grid" style="margin-bottom: 40px; grid-auto-rows: auto;">
        
        <div class="bento-item" style="grid-column: span 4; padding: 20px 30px; justify-content: center;">
          
          <div class="archive-controls" style="border: none; padding: 0; width: 100%; flex-wrap: nowrap; align-items: stretch; gap: 20px;">
            
            <div class="filter-pills" style="display: flex; flex-wrap: wrap; flex: 2; width: 100%; gap: 10px;">
              <button class="filter-pill active" data-filter="all" style="flex: 1 1 80px; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i class="fas fa-layer-group"></i> ALL
              </button>
              <button class="filter-pill" data-filter="graphics" style="flex: 1 1 80px; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i class="fas fa-shapes" style="color: #ff00ea;"></i> GRAPHICS
              </button>
              <button class="filter-pill" data-filter="video" style="flex: 1 1 80px; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i class="fas fa-video" style="color: #ffea00;"></i> VIDEO
              </button>
              <button class="filter-pill" data-filter="photos" style="flex: 1 1 80px; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i class="fas fa-camera" style="color: #00d4ff;"></i> PHOTO
              </button>
              <button class="filter-pill" data-filter="code" style="flex: 1 1 80px; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <i class="fas fa-code" style="color: #00ff41;"></i> CODE
              </button>
            </div>

            <div class="search-wrapper" style="flex: 1; display: flex; width: 100%;">
              <input type="text" id="projectSearch" placeholder="SEARCH ARCHIVE" style="width: 100%; max-width: 100%; height: 100%; text-align: center; letter-spacing: 4px; margin: 0;">
            </div>

          </div>

        </div>
      </div>
      <div id="work-grid" class="work-grid"></div>
      <div id="pagination-controls" class="pagination-container"></div>
    </div>
  </section>

  <footer class="full-width-section" style="margin-top: 120px; padding: 60px 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="footer-left">
        <p style="font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 2px; color: var(--font-mono);">
          © 2026 VINIT RAO // ALL RIGHTS RESERVED
        </p>
      </div>
      <div class="footer-right">
        <a href="#" style="text-decoration: none; font-family: var(--font-mono); font-size: 0.65rem; color: white; letter-spacing: 2px; text-transform: uppercase;">
          Back to Top ↑
        </a>
      </div>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wGrid = document.getElementById('work-grid');
      const pagContainer = document.getElementById('pagination-controls');
      
      let currentPage = 1;
      const itemsPerPage = 12; 
      let currentFilteredData = projects; 

      const getActionHTML = (type) => {
        const actions = { 'github': '<i class="fab fa-github"></i> View Code', 'youtube': '<i class="fab fa-youtube"></i> Watch Video', 'game': '<i class="fas fa-gamepad"></i> Play Game', 'website': '<i class="fas fa-globe"></i> Visit Site', 'photo': '<i class="fas fa-camera-retro"></i> View Gallery' };
        return actions[type] || '<i class="fas fa-arrow-right"></i> View Project';
      };

      const getCategoryTag = (cat) => {
        const tags = { 'code': '<i class="fas fa-code"></i> CODE', 'graphics': '<i class="fas fa-shapes"></i> GRAPHICS', 'video': '<i class="fas fa-video"></i> VIDEO', 'photos': '<i class="fas fa-camera"></i> PHOTO' };
        return tags[cat] || '<i class="fas fa-folder"></i> PROJECT';
      };

      const createCard = (p) => {
        let badgeHTML = p.badges && p.badges.length > 0 ? p.badges[0].split('|').filter(b => b.trim() !== '').map(b => `<span class="badge">${b.trim()}</span>`).join('') : '';
        let mediaHTML = '', videoDataAttr = '', hoverEvents = '';
        
        if (p.video) {
          mediaHTML = `<img src="${p.image || ''}" loading="lazy">`;
          videoDataAttr = `data-video="${p.video}"`;
          hoverEvents = `onmouseenter="if(this.dataset.video){ const c = this.querySelector('.media-container'); if(!c.querySelector('video')){ const v = document.createElement('video'); v.src = this.dataset.video; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true; v.style.position = 'absolute'; v.style.top = '0'; v.style.left = '0'; v.style.width = '100%'; v.style.height = '100%'; v.style.objectFit = 'cover'; c.insertBefore(v, c.querySelector('.image-overlay')); } }" onmouseleave="const v = this.querySelector('video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }"`;
        } else {
          mediaHTML = `<img src="${p.image}" loading="lazy">`;
        }

        return `
          <div class="project-card" data-link="${p.link}" data-category="${p.category}" ${videoDataAttr} ${hoverEvents}>
            <div class="media-container">${mediaHTML}<div class="image-overlay"></div></div>
            <div class="category-tag cat-${p.category}">${getCategoryTag(p.category)}</div>
            <div class="hover-action-btn">${getActionHTML(p.linkType)}</div>
            <div class="card-content">
              <h3>${p.title}</h3><p>${p.description}</p><div class="badge-container">${badgeHTML}</div>
            </div>
          </div>`;
      };
      
      document.addEventListener('click', (e) => {
        const card = e.target.closest('.project-card');
        if (card) {
          if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
            if (card.classList.contains('touch-hover')) window.open(card.dataset.link, '_blank');
            else { document.querySelectorAll('.project-card.touch-hover').forEach(c => c.classList.remove('touch-hover')); card.classList.add('touch-hover'); }
          } else window.open(card.dataset.link, '_blank');
        } else document.querySelectorAll('.project-card.touch-hover').forEach(c => c.classList.remove('touch-hover'));
      });

      const renderW = () => {
        if(!wGrid) return;
        const totalPages = Math.ceil(currentFilteredData.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const paginatedData = currentFilteredData.slice(startIndex, startIndex + itemsPerPage);
        wGrid.innerHTML = paginatedData.map(p => createCard(p)).join('');
        renderPaginationUI(totalPages);
      };

      const renderPaginationUI = (totalPages) => {
        pagContainer.innerHTML = ''; 
        if (totalPages <= 1) return; 

        const createBtn = (text, pageNum, isActive, isDisabled) => {
          const btn = document.createElement('button');
          btn.className = `page-btn ${isActive ? 'active' : ''}`;
          btn.textContent = text;
          btn.disabled = isDisabled;
          if (!isDisabled && !isActive) {
            btn.addEventListener('click', () => {
              currentPage = pageNum;
              renderW();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          }
          return btn;
        };

        pagContainer.appendChild(createBtn('PREV', currentPage - 1, false, currentPage === 1));
        for (let i = 1; i <= totalPages; i++) {
          pagContainer.appendChild(createBtn(i, i, currentPage === i, false));
        }
        pagContainer.appendChild(createBtn('NEXT', currentPage + 1, false, currentPage === totalPages));
      };

      renderW();

      const searchInput = document.getElementById('projectSearch');
      const filterBtns = document.querySelectorAll('.filter-pill');
      
      if(filterBtns) {
        filterBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.filter === 'all') currentFilteredData = projects;
            else currentFilteredData = projects.filter(p => p.category === btn.dataset.filter);
            currentPage = 1; 
            renderW();
          });
        });
      }

      if(searchInput) {
        searchInput.addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase();
          currentFilteredData = projects.filter(p => p.title.toLowerCase().includes(term) || p.description.toLowerCase().includes(term));
          currentPage = 1; 
          renderW();
        });
      }
    });
  </script>
</body>
</html>
